<ion-content>
  <div class="InputContainer">
    <input
      id="input"
      class="input"
      name="text"
      type="text"
      [(ngModel)]="searchQuery"
      (input)="searchLocationSuggestions()"
      placeholder="Rechercher un lieu..."
      (focus)="showSuggestions = true"
      (blur)="hideSuggestions()"
      autocomplete="off"
      aria-label="Rechercher un lieu"
    />


    <div *ngIf="isLoadingSuggestions" class="loading-indicator">
      <ion-spinner name="dots"></ion-spinner>
    </div>

    <!-- 🔥 Suggestions améliorées -->
    <ul *ngIf="showSuggestions && searchResults.length > 0" class="suggestions">
      <li *ngFor="let result of searchResults; let i = index"
          (click)="selectSuggestion(result)"
          (keydown)="handleKeyDown($event, i)">
        <ion-icon name="location-outline"></ion-icon> {{ result.display_name }}
      </li>
    </ul>

    <label class="labelforsearch" for="input">
      <button (click)="searchLocation()" aria-label="Lancer la recherche">
        <svg class="searchIcon" viewBox="0 0 512 512">
          <path
            d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"
          ></path>
        </svg>
      </button>
    </label>
  </div>

  <!-- 🔥 Route Inputs améliorés -->
  <div class="route-inputs">
    <ion-item>
      <ion-icon name="navigate-outline"></ion-icon>
      <ion-input
        [(ngModel)]="startLocation"
        (keyup)="searchStartSuggestions()"
        (blur)="hideStartSuggestions()"
        placeholder="Adresse de départ"
        autocomplete="off">
      </ion-input>
    </ion-item>

    <ul *ngIf="showStartSuggestions && startSuggestions.length > 0" class="suggestions">
      <li *ngFor="let result of startSuggestions" (click)="selectStartSuggestion(result)">
        {{ result.display_name }}
      </li>
    </ul>

    <ion-item>
      <ion-icon name="flag-outline"></ion-icon>
      <ion-input
        [(ngModel)]="endLocation"
        (keyup)="searchEndSuggestions()"
        (blur)="hideEndSuggestions()"
        placeholder="Adresse d'arrivée"
        autocomplete="off">
      </ion-input>
    </ion-item>

    <ul *ngIf="showEndSuggestions && endSuggestions.length > 0" class="suggestions">
      <li *ngFor="let result of endSuggestions" (click)="selectEndSuggestion(result)">
        {{ result.display_name }}
      </li>
    </ul>

    <ion-button (click)="calculateRoute(startLocation, endLocation)">
      <ion-icon name="map-outline"></ion-icon> Calculer l'itinéraire
    </ion-button>
  </div>

  <!-- 🔥 Indicateur de chargement amélioré -->
  <div *ngIf="isLoading" class="loading-indicator">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Calcul de l'itinéraire...</p>
  </div>


  <!-- 🔥 Map Container -->
  <div id="map"></div>
</ion-content>
