<ion-content>
  <img src="/assets/icon/moovly-logo.png" alt="Moovly" height="150px" width="150px" />

  <ion-card class="card">
    <ion-card-header>
      <ion-card-title id="heading">Créer un compte</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (submit)="registerUser()">
        <ion-list>
          <ion-item class="field">
            <ion-icon name="person" slot="start" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="prenom" name="prenom" type="text" placeholder="Prénom" required class="input-field"></ion-input>
          </ion-item>

          <ion-item class="field">
            <ion-icon name="person" slot="start" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="nom" name="nom" type="text" placeholder="Nom" required class="input-field"></ion-input>
          </ion-item>

          <ion-item class="field">
            <ion-icon name="mail" slot="start" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="email" name="email" type="email" placeholder="Email" required class="input-field"></ion-input>
          </ion-item>

          <ion-item class="field">
            <ion-icon name="lock-closed" slot="start" class="input-icon"></ion-icon>
            <ion-input [(ngModel)]="password" name="password" type="password" placeholder="Mot de passe" required class="input-field"></ion-input>
          </ion-item>
        </ion-list>

        <div class="btn">
          <ion-button class="button1" expand="full" type="submit">S'inscrire</ion-button>
          <ion-label (click)="goToLogin()" class="login-link">J'ai déjà un compte : Se connecter</ion-label>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>


<style>
  .form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-left: 2em;
    padding-right: 2em;
    padding-bottom: 0.4em;
    background-color: #171717;
    border-radius: 25px;
    transition: .4s ease-in-out;
  }

  .form:hover {
    transform: scale(1.05);
    border: 1px solid black;
  }

  #heading {
    text-align: center;
    margin: 2em;
    color: rgb(255, 255, 255);
    font-size: 1.2em;
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    border-radius: 25px;
    padding: 0.6em;
    border: none;
    outline: none;
    color: white;
    background-color: #171717;
    box-shadow: inset 2px 5px 10px rgb(5, 5, 5);
  }

  .input-icon {
    height: 1.3em;
    width: 1.3em;
    fill: white;
  }

  .input-field {
    background: none;
    border: none;
    outline: none;
    width: 100%;
    color: #d3d3d3;
  }

  .form .btn {
    display: flex;
    justify-content: center;
    flex-direction: row;
    margin-top: 2.5em;
  }

  .button1 {
    padding: 0.5em;
    padding-left: 1.1em;
    padding-right: 1.1em;
    border-radius: 5px;
    margin-right: 0.5em;
    border: none;
    outline: none;
    transition: .4s ease-in-out;
    background-color: #252525;
    color: white;
  }

  .button1:hover {
    background-color: black;
    color: white;
  }

  .button2 {
    padding: 0.5em;
    padding-left: 2.3em;
    padding-right: 2.3em;
    border-radius: 5px;
    border: none;
    outline: none;
    transition: .4s ease-in-out;
    background-color: #252525;
    color: white;
  }

  .button2:hover {
    background-color: black;
    color: white;
  }

  .button3 {
    margin-bottom: 3em;
    padding: 0.5em;
    border-radius: 5px;
    border: none;
    outline: none;
    transition: .4s ease-in-out;
    background-color: #252525;
    color: white;
  }

  .button3:hover {
    background-color: red;
    color: white;
  }
</style>
